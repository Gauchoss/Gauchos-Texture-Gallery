# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties (von https://github.com/FabricMC/fabric-example-mod, Branch 1.21.11)
minecraft_version=1.21.11
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.141.6+1.21.11

# Mod Properties
version=1.0.0
group=de.gaucho.gallery

# Woher die Mod Texturen + Kill-Sounds laedt (GitHub "besitzer/repo" und Branch).
# Beim Bauen ueber GitHub Actions wird das AUTOMATISCH auf dein Repo gesetzt.
# Nur wenn du lokal baust, musst du das hier anpassen.
gallery_repo=DEIN-GITHUB-NAME/gauchos-texture-gallery
gallery_branch=main
